[workspace]
resolver = "3"
members = [
    "crates/freecad-core",
    "crates/freecad-kernel",
    "crates/freecad-kernel-occt",
    "crates/freecad-io",
    "crates/freecad-render",
    "crates/freecad-android",
    "crates/freecad-ux",
]

[workspace.package]
edition = "2024"
license = "LGPL-2.1-or-later"
repository = "https://github.com/Egorich-print/FreeCAD"

[workspace.dependencies]
freecad-core = { path = "crates/freecad-core" }
freecad-kernel = { path = "crates/freecad-kernel" }
freecad-kernel-occt = { path = "crates/freecad-kernel-occt" }
freecad-render = { path = "crates/freecad-render" }
freecad-io = { path = "crates/freecad-io" }
freecad-ux = { path = "crates/freecad-ux" }
cxx = "1"
cxx-build = "1"
pollster = "0.4"
glam = "0.29"
wgpu = "25"
quick-xml = "0.36"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
