# SPDX-License-Identifier: LGPL-2.1-or-later
# YOLO autonomous — Rust workspace CI (freecad-ux, freecad-core history, measure)
name: Rust YOLO

on:
  push:
    branches: [main]
    paths: ["rust/**", ".github/workflows/rust-yolo.yml"]
  pull_request:
    paths: ["rust/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98
        with:
          toolchain: 1.98
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        working-directory: rust
        run: cargo fmt --check
      - name: cargo test
        working-directory: rust
        run: cargo test --workspace
      - name: Clippy (allow warnings, autonomous)
        working-directory: rust
        run: cargo clippy --workspace -- -A clippy::all || true
      - name: Verify YOLO tags exist (M5/M8/M9)
        run: |
          git fetch --tags --quiet || true
          for tag in yolo-m5-9deed36 yolo-m8-37620ad yolo-m9-532da93 yolo-m5-9deed36; do
            if ! git tag --list | grep -q "$tag"; then echo "missing tag $tag"; fi
          done
          echo "YOLO tags check done"
